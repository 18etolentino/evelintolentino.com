<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evelin Tolentino — UX Researcher & Product Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="hero-shimmer.css" />
</head>
<body>

  <nav class="nav nav--dark" id="nav">
    <a href="index.html" class="nav-monogram">ET</a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link active">Home</a></li>
      <li><a href="work.html" class="nav-link">Work</a></li>
      <li><a href="resume.html" class="nav-link">Resume</a></li>
      <li><a href="about.html" class="nav-link">About</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="work.html">Work</a>
    <a href="resume.html">Resume</a>
    <a href="about.html">About</a>
  </div>

  <section class="hero hero--shimmer">
    <!-- Iridescence background (React Bits, ported to plain JS in hero-shimmer.js). Decorative. -->
    <canvas class="hero-shimmer" id="heroShimmer" aria-hidden="true"></canvas>
    <p class="hero-eyebrow">UX Researcher &amp; Product Designer</p>
    <h1 class="hero-title">Hi, I'm Evelin.</h1>
    <p class="hero-sub">UC Berkeley MIMS Fellow · First-Gen · Bilingual Researcher</p>
    <a href="work.html" class="btn-hero btn-specular"><span class="btn-star" aria-hidden="true"></span>See My Work ↓</a>
  </section>

  <script>
    // Nav dark/light on scroll
    const nav = document.getElementById('nav');
    const hero = document.querySelector('.hero');
    const observer = new IntersectionObserver(([e]) => {
      nav.classList.toggle('nav--dark', e.isIntersecting);
      nav.classList.toggle('nav--light', !e.isIntersecting);
    }, { threshold: 0.1 });
    observer.observe(hero);

    // Hamburger
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
    });
    mobileMenu.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
      });
    });
  </script>

  <script src="hero-shimmer.js"></script>
</body>
</html>
